services:
  eureka:
    build: ./eureka-server
    ports: ["8761:8761"]
  categoria:
    environment:
      EUREKA_URL: http://eureka:8761/eureka
    build: ./categoria-service
    ports: ["8082:8082"]
    depends_on: [eureka]
  producto:
    environment:
      EUREKA_URL: http://eureka:8761/eureka
    build: ./producto-service
    ports: ["8083:8083"]
    depends_on: [eureka, categoria]
  cliente:
    environment:
      EUREKA_URL: http://eureka:8761/eureka
    build: ./cliente-service
    ports: ["8084:8084"]
    depends_on: [eureka]
  pedido:
    environment:
      EUREKA_URL: http://eureka:8761/eureka
    build: ./pedido-service
    ports: ["8085:8085"]
    depends_on: [eureka, producto, cliente]
