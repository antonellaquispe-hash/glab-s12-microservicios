server:
  port: 8082
spring:
  application:
    name: categoria-service
  datasource:
    url: jdbc:h2:file:./data/categoria-service;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
